project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - 404.qmd
    - quarto/**
    
    
author:
  - name: Vagish Hemmige
    email: vagish.hemmige@gmail.com



# The site documents the code and never runs the analysis. Chunks that
# must run (the read_chunk() imports, the setup page's summary tables and
# the results pages) set eval: true themselves.
execute:
  eval: false

website:
  site-url: https://vagishhemmige.github.io/HOPE-CDC-analysis-2026
  repo-url: https://github.com/VagishHemmige/HOPE-CDC-analysis-2026
  repo-branch: master
  repo-actions: [edit, issue]
  title: "Geographic Access of People Living with HIV to Solid Organ Transplant"

  # Each kind of page has one icon, coloured in styles.css: book =
  # background, diagram-3 = study design and methods, laptop = R code,
  # clipboard-data = results, file-earmark-ruled = project documents.
  sidebar:
    style: "docked"
    search: true
    # Every section starts open, including those inside Code
    collapse-level: 3
    contents:
      - href: index.qmd
        text: Home
        icon: house

      - section: Background
        contents:
          - href: quarto/background.qmd
            text: Clinical background
            icon: book

      - href: quarto/analysis_methods.qmd
        text: Study design and methods
        icon: diagram-3

      - section: Code
        contents:
          - section: Setup and helper functions
            contents:
              - href: quarto/setup.qmd
                text: Setup
                icon: laptop
              - href: quarto/functions.qmd
                text: Functions
                icon: laptop

          # One page per definitive script, in the order main.R sources them.
          - section: Data loading and processing
            contents:
              - href: quarto/load_data.qmd
                text: Load data
                icon: laptop
              - href: quarto/classify_centers.qmd
                text: Classify centers
                icon: laptop
              - href: quarto/county_geographic_calculations.qmd
                text: County-level geographic calculations
                icon: laptop
              - href: quarto/geographical_computations_for_centers.qmd
                text: Center-level geographic calculations
                icon: laptop
              - href: quarto/set_isochrones.qmd
                text: Set isochrones
                icon: laptop
              - href: quarto/unite_buffers.qmd
                text: Unite buffers
                icon: laptop
              - href: quarto/join_tracts_to_buffers.qmd
                text: Join tracts to buffers
                icon: laptop
              - href: quarto/join_tracts_to_united_buffers.qmd
                text: Join tracts to united buffers
                icon: laptop
              - href: quarto/calculate_aggregated_results.qmd
                text: Calculate aggregated results
                icon: laptop

          - section: Code to create tables and figures
            contents:
              - href: quarto/tables.qmd
                text: Tables
                icon: laptop
              - href: quarto/figures.qmd
                text: Figures
                icon: laptop

      - section: Results, separated by organ
        contents:
          - href: quarto/results_kidney.qmd
            text: Kidney
            icon: clipboard-data
          - href: quarto/results_liver.qmd
            text: Liver
            icon: clipboard-data
          - href: quarto/results_heart.qmd
            text: Heart
            icon: clipboard-data
          - href: quarto/results_lung.qmd
            text: Lung
            icon: clipboard-data
          - href: quarto/results_pancreas.qmd
            text: Pancreas
            icon: clipboard-data


      - section: Project documents
        contents:
          - href: quarto/analysis-plan.qmd
            text: Analysis plan
            icon: file-earmark-ruled
          - href: quarto/architecture.qmd
            text: Architecture
            icon: file-earmark-ruled
          - href: quarto/agents.qmd
            text: AGENTS.md
            icon: file-earmark-ruled
          - href: quarto/repository-blueprint.qmd
            text: Repository blueprint
            icon: file-earmark-ruled

      - href: quarto/about.qmd
        text: About
        icon: info-circle

  page-navigation: true

# Each kind of content has one callout: Rcode for code, Results for results,
# Pending for provisional content (added by quarto/_pending.lua).
custom-callout:
  Rcode:
    icon: true
    icon-symbol: "💻 "
    color: "pink"
  Results:
    icon: true
    icon-symbol: "📊"
    color: "#198754"
  Pending:
    icon: true
    icon-symbol: "⏳"
    color: "#f0c400"

filters:
  # Yellow marks for provisional content, and their Pending callout. It runs
  # before custom-callout, which turns the callout it adds into a styled box.
  - quarto/_pending.lua
  - custom-callout

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    page-layout: full
    code-summary: "Click to show/hide R Code"
    lightbox: true
